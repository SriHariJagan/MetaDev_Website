    <link

    <title>MetaDev | Software Development &amp; Digital Solutions</title>
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('theme');
        } catch (e) {
          stored = null;
        }
        var theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <style>
      /* First-paint loader — inline so it paints instantly with zero requests. */
      .md-loader {
        --md-loader-bg: #f7f9ff;
        --md-loader-text: #0b1220;
        --md-loader-muted: #64748b;
        --md-loader-line: rgba(79, 70, 229, 0.16);
        --md-loader-tile: rgba(255, 255, 255, 0.84);
        --md-loader-track: rgba(15, 23, 42, 0.09);
        --md-loader-mark-a: #4f46e5;
        --md-loader-mark-b: #0891b2;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
        background-color: var(--md-loader-bg);
        background-image:
          radial-gradient(circle at 16% 10%, rgba(99, 102, 241, 0.16), transparent 42%),
          radial-gradient(circle at 86% 92%, rgba(34, 211, 238, 0.14), transparent 46%);
        transition: opacity 0.3s ease, visibility 0.3s ease;
        /* CSS-owned timeout: the loader fades itself out even if the main
           thread is busy or JavaScript fails. Keeps the hard cap under 2s. */
        animation: md-loader-timeout 0.3s ease 1.45s forwards;
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
        color: var(--md-loader-text);
      }

      html[data-theme='dark'] .md-loader {
        --md-loader-bg: #070f1d;
        --md-loader-text: #f8fafc;
        --md-loader-muted: #94a3b8;
        --md-loader-line: rgba(129, 140, 248, 0.2);
        --md-loader-tile: rgba(255, 255, 255, 0.05);
        --md-loader-track: rgba(148, 163, 184, 0.18);
        --md-loader-mark-a: #818cf8;
        --md-loader-mark-b: #22d3ee;
        background-image:
          radial-gradient(circle at 16% 10%, rgba(99, 102, 241, 0.22), transparent 44%),
          radial-gradient(circle at 86% 92%, rgba(34, 211, 238, 0.16), transparent 48%);
      }

      .md-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* React uses the same lockup as its route fallback, but it must stay
         visible until the route has rendered — no self-timeout. */
      .md-loader--persistent {
        animation: none;
        opacity: 1;
        visibility: visible;
      }

      .md-loader__content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: md-loader-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .md-loader__mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 80px;
        height: 80px;
        margin-bottom: 26px;
        border-radius: 24px;
        background: var(--md-loader-tile);
        border: 1px solid var(--md-loader-line);
        box-shadow:
          0 22px 60px -26px rgba(30, 41, 59, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }

      .md-loader__halo {
        position: absolute;
        inset: -22px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.34), transparent 68%);
        filter: blur(9px);
        animation: md-loader-pulse 2.4s ease-in-out infinite;
      }

      .md-loader__arc {
        position: absolute;
        inset: -4px;
        padding: 2px;
        border-radius: 28px;
        background: conic-gradient(
          from 0deg,
          transparent 0 52%,
          rgba(99, 102, 241, 0.12) 66%,
          #6366f1 86%,
          #22d3ee 100%
        );
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask-composite: exclude;
        animation: md-loader-spin 1.6s linear infinite;
      }

      .md-loader__glyph {
        position: relative;
        width: 40px;
        height: 40px;
      }

      .md-loader__wordmark {
        font-size: 27px;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1;
      }

      .md-loader__wordmark span {
        background-image: linear-gradient(100deg, #6366f1, #22d3ee);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      html[data-theme='dark'] .md-loader__wordmark span {
        background-image: linear-gradient(100deg, #a5b4fc, #67e8f9);
      }

      .md-loader__track {
        position: relative;
        width: 172px;
        height: 3px;
        margin-top: 22px;
        overflow: hidden;
        border-radius: 999px;
        background-color: var(--md-loader-track);
        background-image: linear-gradient(
          90deg,
          rgba(99, 102, 241, 0.4),
          rgba(34, 211, 238, 0.4)
        );
      }

      .md-loader__track span {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 38%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #6366f1 35%, #22d3ee 70%, transparent);
        animation: md-loader-sweep 1.35s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .md-loader__caption {
        margin: 14px 0 0;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--md-loader-muted);
        animation: md-loader-fade 2s ease-in-out infinite;
      }

      @keyframes md-loader-timeout {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }

      @keyframes md-loader-spin {
        to {
          transform: rotate(1turn);
        }
      }

      @keyframes md-loader-pulse {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.94);
        }
        50% {
          opacity: 1;
          transform: scale(1.06);
        }
      }

      @keyframes md-loader-sweep {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(360%);
        }
      }

      @keyframes md-loader-fade {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes md-loader-in {
        from {
          transform: translateY(8px) scale(0.99);
        }
        to {
          transform: translateY(0) scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .md-loader,
        .md-loader * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="app-loader"
      class="md-loader"
      role="status"
      aria-live="polite"
      aria-label="Loading MetaDev"
    >
      <div class="md-loader__content">
        <div class="md-loader__mark" aria-hidden="true">
          <span class="md-loader__halo"></span>
          <span class="md-loader__arc"></span>
          <svg class="md-loader__glyph" viewBox="0 0 48 48" fill="none">
            <path
              d="M12 33V15l12 12 12-12v18"
              stroke="url(#md-loader-gradient)"
              stroke-width="4.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <defs>
              <linearGradient
                id="md-loader-gradient"
                x1="10"
                y1="12"
                x2="38"
                y2="35"
                gradientUnits="userSpaceOnUse"
              >
                <stop style="stop-color: var(--md-loader-mark-a)" />
                <stop offset="1" style="stop-color: var(--md-loader-mark-b)" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="md-loader__wordmark" aria-hidden="true"><span>Meta</span>Dev</div>
        <div class="md-loader__track" aria-hidden="true"><span></span></div>
        <p class="md-loader__caption" aria-hidden="true">Engineering what's next</p>
      </div>
    </div>
    <script>
      (function () {
        var loader = document.getElementById('app-loader');
        if (!loader) return;

        var startedAt = performance.now();
        var hidden = false;
        var MIN_VISIBLE = 350;
        var FADE_MS = 300;

        function finish() {
          if (hidden) return;
          hidden = true;

          var elapsed = performance.now() - startedAt;
          var wait = Math.max(0, MIN_VISIBLE - elapsed);

          window.setTimeout(function () {
            loader.classList.add('is-hidden');
            loader.setAttribute('aria-hidden', 'true');
            window.setTimeout(function () {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, FADE_MS);
          }, wait);
        }

        window.__hideMetaDevLoader = finish;
        // Backstop for DOM cleanup; the CSS animation guarantees the visual
        // timeout even when this callback is delayed by a busy main thread.
        window.setTimeout(finish, 1450);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
